##########################################################################
# THIS FILE LIVES IN .github/workflows/terrateam.yml
#
# Stategraph Orchestration dispatches this workflow for every plan and apply.
# The work-token and api-base-url inputs are passed in by the backend.
##########################################################################
name: 'Terrateam Workflow'
on:
  workflow_dispatch:
    inputs:
      work-token:
        description: 'Work Token'
        required: true
      api-base-url:
        description: 'API Base URL'
      environment:
        description: 'Environment in which to run the action'
        type: environment
jobs:
  terrateam:
    permissions: # Required to pass credentials to the Terrateam action
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    name: Terrateam Action
    environment: '${{ github.event.inputs.environment }}'
    steps:
      - uses: actions/checkout@v4
      - name: Run Terrateam Action
        id: terrateam
        uses: terrateamio/action@v1
        with:
          work-token: '${{ github.event.inputs.work-token }}'
          api-base-url: '${{ github.event.inputs.api-base-url }}'
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
